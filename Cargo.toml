[package]
name = "ang"
version = "0.5.5"
edition = "2021"
authors = ["antrax <antraxbr666>"]
description = "Alias Next Generation - A modern alias browser"
license = "MIT"
repository = "https://github.com/antraxbr666/alias-ng"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
ratatui = "0.29"
crossterm = "0.28"
dirs = "5"
glob = "0.3"
shellexpand = "3"
make_colors = "1.0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
