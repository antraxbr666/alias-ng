[package]
name = "ang"
version = "0.2.3"
edition = "2021"
authors = ["antrax <antraxbr666>"]
description = "Alias Next Generation - A modern alias browser"
license = "MIT"
repository = "https://github.com/antraxbr666/alias-ng"

[dependencies]
rich_rust = "0.2"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
anyhow = "1"
ratatui = "0.29"
crossterm = "0.28"
fuzzy-matcher = "0.3"
dirs = "5"
glob = "0.3"
shellexpand = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
